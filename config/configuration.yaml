# Local development example. Replace the sample entity IDs with real sensors.
default_config:

logger:
  default: info
  logs:
    custom_components.adaptive_climate_control: debug

adaptive_climate_control:
  outside_entity: sensor.outside_temperature
  rooms:
    example_room:
      temperature_entity: sensor.example_room_temperature
      capacity_j_k: 1000000
  surfaces:
    - name: outer_wall
      zone_a: example_room
      zone_b: outside
      area_m2: 10
      u_w_m2k: 0.5
